name: Lint Workflows

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '**/action.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '**/action.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
        continue-on-error: true

  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.6.2
        continue-on-error: true

  action-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check action READMEs are up to date
        run: |
          for action_yml in $(find . -mindepth 2 -name action.yml); do
            dir=$(dirname "$action_yml")
            [ -f "$dir/README.md" ] || continue
            (cd "$dir" && npx --yes action-docs@2.5.1 --update-readme)
          done
          if ! git diff --exit-code -- '**/README.md'; then
            echo "::error::One or more action READMEs are out of date. Run 'npx action-docs@2.5.1 --update-readme' inside the changed action's directory and commit the result."
            exit 1
          fi
