name: Self Release

on:
  workflow_dispatch:
  push:
    branches: [main]

# Serialise release runs on main so two rapid pushes can't race release-please
# or the floating-tag force-push below.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Must grant at least what the called release.yml requests, otherwise the
# reusable-workflow call fails at startup ("requesting 'contents: write', but is
# only allowed 'contents: read'").
permissions:
  contents: write
  pull-requests: write
  packages: write
  pages: write
  id-token: write

jobs:
  release:
    uses: ./.github/workflows/release.yml
    with:
      language: none
      run-docker-build: false
      run-docs: false
    secrets: inherit

  float-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: release
    if: needs.release.outputs.release-created == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag-name }}
          fetch-depth: 0

      - name: Update floating major tag
        env:
          TAG: ${{ needs.release.outputs.tag-name }}
        run: |
          set -euo pipefail
          MAJOR="${TAG%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa "$MAJOR" -m "Update $MAJOR tag"
          git push origin "$MAJOR" --force
