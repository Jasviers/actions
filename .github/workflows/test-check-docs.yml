name: Test Docs Scripts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'make-docs/**'
      - 'test/bats/**'
      - '.github/workflows/test-check-docs.yml'
  push:
    branches: [main]
    paths:
      - 'make-docs/**'
      - 'test/bats/**'
      - '.github/workflows/test-check-docs.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # npx instead of `npm install -g`: the runner's global npm prefix is not
      # writable without setup-node (exit 243).
      - name: Run bats
        run: |
          # renovate: datasource=npm depName=bats
          npx --yes bats@1.13.0 --print-output-on-failure test/bats/
