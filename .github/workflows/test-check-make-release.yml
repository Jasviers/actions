name: Test Make Release Action

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'make-release/**'
      - '.github/workflows/test-check-make-release.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-make-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test Make Release Action
        uses: ./make-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
