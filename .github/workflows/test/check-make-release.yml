name: Test Make Release Action

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'make-release/**'

jobs:
  test-make-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test Make Release Action
        uses: ./make-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
