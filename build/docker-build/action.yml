name: 'Docker build action'
description: 'Create a Docker image from a Dockerfile'

inputs:
  working-directory:
    description: 'Build context directory (relative to the checkout root)'
    required: false
    default: '.'
  registry:
    description: 'Container registry URL'
    required: false
    default: 'ghcr.io'
  image-name:
    description: 'Image name (defaults to repository name)'
    required: false
    default: ${{ github.repository }}
  github-token:
    description: 'GitHub token for registry authentication'
    required: true
  push:
    description: 'Push image to registry'
    required: false
    default: 'true'
  generate-sbom:
    description: 'Generate a Software Bill of Materials (SPDX JSON) for the built image and upload it as an artifact'
    required: false
    default: 'false'

outputs:
  image-tag:
    description: 'Full image tag with registry'
    value: ${{ steps.meta.outputs.tags }}
  image-digest:
    description: 'Image digest'
    value: ${{ steps.build-and-push.outputs.digest }}

runs:
  using: 'composite'
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log into registry
      if: inputs.push == 'true'
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ inputs.registry }}/${{ inputs.image-name }}

    - name: Build and push Docker image
      id: build-and-push
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.working-directory }}
        push: ${{ inputs.push }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Generate SBOM
      if: inputs.generate-sbom == 'true' && inputs.push == 'true'
      uses: anchore/sbom-action@v0.24.2
      with:
        image: ${{ steps.meta.outputs.tags }}
        format: spdx-json
        artifact-name: docker-sbom