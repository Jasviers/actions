name: 'Python Documentation Generator'
description: 'Generate Python project documentation using Sphinx and deploy to GitHub Pages'
author: 'jasviers'

inputs:
  working-directory:
    description: 'Directory containing the project source (relative to the checkout root)'
    required: false
    default: '.'
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.x'
  github-token:
    description: 'GitHub token for uploading results and deploying to Pages'
    required: false
    default: ${{ github.token }}
  project-name:
    description: 'Project name for documentation'
    required: false
    default: ${{ github.event.repository.name }}
  author:
    description: 'Author name for documentation'
    required: false
    default: ${{ github.repository_owner }}
  version:
    description: 'Project version (a leading "v" is stripped)'
    required: false
    default: '1.0.0'
  strict-docs:
    description: "Treat Sphinx build warnings as errors (-W). Set to 'false' for a lenient build."
    required: false
    default: 'true'
  deploy-to-pages:
    description: 'Deploy documentation to GitHub Pages'
    required: false
    default: 'true'

outputs:
  page-url:
    description: 'URL of the deployed documentation site (empty when deploy-to-pages is false)'
    value: ${{ steps.deployment.outputs.page_url }}

runs:
  using: 'composite'
  steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Sphinx and dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        pip install sphinx sphinx-rtd-theme sphinx-autodoc-typehints
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi
        if [ -f setup.py ]; then
          pip install -e . || true
        fi
        if [ -f pyproject.toml ]; then
          pip install -e . || true
        fi

    - name: Initialize Sphinx configuration
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PROJECT_NAME: ${{ inputs.project-name }}
        AUTHOR: ${{ inputs.author }}
        PROJECT_VERSION: ${{ inputs.version }}
      run: |
        chmod +x "${{ github.action_path }}/init-sphinx.sh"
        "${{ github.action_path }}/init-sphinx.sh" "$PROJECT_NAME" "$AUTHOR" "$PROJECT_VERSION"

    - name: Generate Documentation
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        STRICT_DOCS: ${{ inputs.strict-docs }}
      run: |
        chmod +x "${{ github.action_path }}/generate-docs.sh"
        "${{ github.action_path }}/generate-docs.sh"

    - name: Setup Pages
      if: ${{ inputs.deploy-to-pages == 'true' }}
      uses: actions/configure-pages@v6

    - name: Upload to GitHub Pages
      if: ${{ inputs.deploy-to-pages == 'true' }}
      uses: actions/upload-pages-artifact@v5
      with:
        path: ${{ inputs.working-directory }}/docs/_build/html

    - name: Deploy to GitHub Pages
      if: ${{ inputs.deploy-to-pages == 'true' }}
      id: deployment
      uses: actions/deploy-pages@v5
      with:
        token: ${{ inputs.github-token }}

    - name: Output Documentation URL
      shell: bash
      if: ${{ inputs.deploy-to-pages == 'true' }}
      env:
        PAGE_URL: ${{ steps.deployment.outputs.page_url }}
      run: |
        echo "Documentation deployed to: $PAGE_URL"
