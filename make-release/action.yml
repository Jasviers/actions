name: "Changelog Generator"
description: "Generate a changelog based on commit messages"
inputs:
  token:
    description: 'GitHub token'
    required: false
    default: ${{ github.token }}
  config-file:
    description: 'Path to the release-please config file, relative to the checkout root'
    required: false
    default: 'release-please-config.json'
  manifest-file:
    description: 'Path to the release-please manifest file, relative to the checkout root'
    required: false
    default: '.release-please-manifest.json'
  dry-run:
    description: 'Verify the release-please config/manifest exist and skip the release-please step (no releases, no PRs)'
    required: false
    default: 'false'

outputs:
  release-created:
    description: 'Whether a release was created on this run'
    value: ${{ steps.release-please.outputs.release_created }}
  tag-name:
    description: 'Tag name of the release created on this run, if any'
    value: ${{ steps.release-please.outputs.tag_name }}

runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Verify release-please config exists
      shell: bash
      env:
        CONFIG_FILE: ${{ inputs.config-file }}
        MANIFEST_FILE: ${{ inputs.manifest-file }}
      run: |
        if [ ! -f "$CONFIG_FILE" ]; then
          echo "::error::release-please config file not found at '$CONFIG_FILE'. Every repo using make-release needs its own release-please-config.json and .release-please-manifest.json at its root (or point config-file/manifest-file at a custom path)."
          exit 1
        fi
        if [ ! -f "$MANIFEST_FILE" ]; then
          echo "::error::release-please manifest file not found at '$MANIFEST_FILE'."
          exit 1
        fi

    - name: Make Release
      id: release-please
      if: inputs.dry-run != 'true'
      uses: googleapis/release-please-action@v5
      with:
        token: ${{ inputs.token }}
        config-file: ${{ inputs.config-file }}
        manifest-file: ${{ inputs.manifest-file }}

    - name: Dry run summary
      if: inputs.dry-run == 'true'
      shell: bash
      run: |
        echo "dry-run: release-please config verified, release step skipped"
