name: 'Go Unit Tests'
description: 'Run Go unit tests using go test'
author: 'jasviers'
branding:
  icon: 'check-square'
  color: 'green'

inputs:
  working-directory:
    description: 'Directory containing the project source (relative to the checkout root)'
    required: false
    default: '.'
  go-version:
    description: 'Go version to use'
    required: false
    default: 'stable'
  min-coverage:
    description: 'Minimum total coverage percentage required (0 disables the gate)'
    required: false
    default: '0'

outputs:
  coverage-file:
    description: 'Path to the coverage report (relative to the checkout root)'
    value: ${{ inputs.working-directory }}/coverage.out
  test-results:
    description: 'Test step outcome (success/failure); readable by callers that set continue-on-error on this action'
    value: ${{ steps.run-tests.outcome }}

runs:
  using: 'composite'
  steps:
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ inputs.go-version }}

    - name: Run tests
      id: run-tests
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      continue-on-error: true
      run: go test ./... -coverprofile=coverage.out

    - name: Enforce minimum coverage
      if: inputs.min-coverage != '0' && steps.run-tests.outcome == 'success'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        MIN_COVERAGE: ${{ inputs.min-coverage }}
      run: |
        go tool cover -func=coverage.out | awk -v min="$MIN_COVERAGE" '/^total:/ { if ($3+0 < min) { print "Coverage " $3 " is below minimum " min "%"; exit 1 } }'

    - name: Upload coverage artifact
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: coverage-report
        path: ${{ inputs.working-directory }}/coverage.out
        retention-days: 30

    - name: Fail if tests failed
      if: steps.run-tests.outcome != 'success'
      shell: bash
      run: |
        echo "::error::go test reported failures"
        exit 1
