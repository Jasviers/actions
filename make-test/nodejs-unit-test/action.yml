name: 'Node.js Unit Tests'
description: 'Run Node.js unit tests using an npm script'
author: 'jasviers'

inputs:
  working-directory:
    description: 'Directory containing the project source (relative to the checkout root)'
    required: false
    default: '.'
  node-version:
    description: 'Node.js version to use'
    required: false
    default: 'lts/*'
  test-script:
    description: 'npm script to run for tests'
    required: false
    default: 'test'

outputs:
  test-results:
    description: 'Test execution results'
    value: ${{ steps.run-tests.outcome }}

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci

    - name: Run tests
      id: run-tests
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm run ${{ inputs.test-script }}
