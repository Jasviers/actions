name: 'Python Unit Tests'
description: 'Run Python unit tests using pytest'
author: 'jasviers'

inputs:
  working-directory:
    description: 'Directory containing the project source (relative to the checkout root)'
    required: false
    default: '.'
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.x'
  test-directory:
    description: 'Directory containing tests'
    required: false
    default: 'test'
  pytest-args:
    description: 'Additional pytest arguments'
    required: false
    default: '-v --cov --cov-report=xml --cov-report=term'
  github-token:
    description: 'GitHub token for uploading SARIF results'
    required: false
    default: ''

outputs:
  coverage-file:
    description: 'Path to coverage report'
    value: 'coverage.xml'
  test-results:
    description: 'Test execution results'
    value: ${{ steps.run-tests.outcome }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi
        if [ -f setup.py ]; then
          pip install -e .
        fi
        if [ -f pyproject.toml ]; then
          pip install -e ".[dev]"
        fi

    - name: Run tests
      id: run-tests
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TEST_DIRECTORY: ${{ inputs.test-directory }}
        PYTEST_ARGS: ${{ inputs.pytest-args }}
      run: |
        pytest "$TEST_DIRECTORY" $PYTEST_ARGS

    - name: Upload coverage to artifacts
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: coverage-report
        path: |
          ${{ inputs.working-directory }}/coverage.xml
          ${{ inputs.working-directory }}/htmlcov/
        retention-days: 30
