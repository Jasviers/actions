name: 'Compliance Checks'
description: 'Run CodeQL compliance and security analysis for Python code'
author: 'jasviers'

inputs:
  working-directory:
    description: 'Directory containing the project source (relative to the checkout root)'
    required: false
    default: '.'
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.x'
  codeql-queries:
    description: 'CodeQL query suite to use (security-and-quality, security-extended, or security-only)'
    required: false
    default: 'security-and-quality'
  upload-sarif:
    description: 'Upload SARIF results to GitHub Security'
    required: false
    default: 'true'
  github-token:
    description: 'GitHub token for uploading SARIF results'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: python
        queries: ${{ inputs.codeql-queries }}
        source-root: ${{ inputs.working-directory }}

    - name: Install Python dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi
        if [ -f setup.py ]; then
          pip install -e .
        fi
        if [ -f pyproject.toml ]; then
          pip install -e .
        fi

    - name: Perform CodeQL Analysis
      id: analyze
      uses: github/codeql-action/analyze@v4
      continue-on-error: true
      with:
        category: "/language:python"
        output: codeql-results.sarif
        upload: false
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}

    - name: Upload SARIF to GitHub Security
      if: ${{ inputs.upload-sarif == 'true' && inputs.github-token != '' }}
      uses: github/codeql-action/upload-sarif@v4
      continue-on-error: true
      with:
        sarif_file: codeql-results.sarif
        category: "/language:python"
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}

    - name: Upload SARIF as artifact
      uses: actions/upload-artifact@v7
      with:
        name: codeql-sarif-results
        path: codeql-results.sarif
        retention-days: 30
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
