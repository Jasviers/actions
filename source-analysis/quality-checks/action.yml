name: 'Quality Checks'
description: 'Run code quality checks for multiple programming languages'
author: 'jasviers'
branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  language:
    description: 'Programming language (python, go, nodejs, terraform, ansible, kubernetes, none)'
    required: true
  working-directory:
    description: 'Directory containing the project source (relative to the checkout root)'
    required: false
    default: '.'
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.x'
  go-version:
    description: 'Go version to use'
    required: false
    default: 'stable'
  node-version:
    description: 'Node.js version to use'
    required: false
    default: 'lts/*'
  terraform-version:
    description: 'Terraform version to use'
    required: false
    default: 'latest'
  skip-hadolint:
    description: 'Skip Dockerfile linting'
    required: false
    default: 'false'
  skip-markdown-checks:
    description: 'Skip Markdown linting and formatting checks'
    required: false
    default: 'false'
  skip-shellcheck:
    description: 'Skip shellcheck on shell scripts'
    required: false
    default: 'false'
  skip-yamllint:
    description: 'Skip yamllint on YAML files (style/syntax only — no Kubernetes schema/best-practice checks)'
    required: false
    default: 'false'
  kubeconform-ignore-filename-pattern:
    description: 'Regular expression of file paths for kubeconform to skip (e.g. YAML files that are not Kubernetes manifests). Passed as -ignore-filename-pattern; left empty to check every file.'
    required: false
    default: ''
  dockerfile-path:
    description: 'Path to Dockerfile'
    required: false
    default: './Dockerfile'
  github-token:
    description: 'GitHub token for uploading SARIF results'
    required: false
    default: ''
  artifact-suffix:
    description: "Suffix appended to every uploaded artifact name, e.g. '-python'. Set it when the action runs more than once per workflow run (matrix or monorepo), since artifact names must be unique per run."
    required: false
    default: ''

outputs:
  hadolint-sarif:
    description: 'Path to hadolint SARIF results (empty when skipped or no Dockerfile found)'
    value: ${{ steps.check-hadolint.outputs.sarif-file }}

runs:
  using: 'composite'
  steps:
    - name: Validate language
      shell: bash
      env:
        LANGUAGE: ${{ inputs.language }}
      run: |
        case "$LANGUAGE" in
          python|go|nodejs|terraform|ansible|kubernetes|none) ;;
          *)
            echo "::error::quality-checks: unknown language '$LANGUAGE' (expected one of python, go, nodejs, terraform, ansible, kubernetes, none)"
            exit 1
            ;;
        esac

    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    # Universal checks. They glob the whole repo, so they run before any language step
    # creates node_modules/, .terraform/ or similar trees full of third-party files.
    - name: Set up Node.js for Markdown checks
      if: inputs.skip-markdown-checks == 'false'
      uses: actions/setup-node@v7
      with:
        node-version: 'lts/*'

    - name: Install markdownlint-cli
      if: inputs.skip-markdown-checks == 'false'
      shell: bash
      run: |
        # renovate: datasource=npm depName=markdownlint-cli
        npm install -g markdownlint-cli@0.49.1

    - name: Run markdownlint
      if: inputs.skip-markdown-checks == 'false'
      shell: bash
      run: |
        if ls .markdownlint.{yml,yaml,json,jsonc} >/dev/null 2>&1; then
          markdownlint "**/*.md" --ignore "CHANGELOG.md" --ignore node_modules
        else
          echo "No .markdownlint config in the repo — using the bundled default"
          markdownlint "**/*.md" --ignore "CHANGELOG.md" --ignore node_modules --config "${{ github.action_path }}/markdownlint.default.yml"
        fi

    - name: Run yamllint
      if: inputs.skip-yamllint == 'false'
      shell: bash
      run: |
        # renovate: datasource=pypi depName=yamllint
        command -v yamllint >/dev/null 2>&1 || pip install --quiet --disable-pip-version-check yamllint==1.38.0
        yamllint .

    - name: Run shellcheck
      if: inputs.skip-shellcheck == 'false'
      uses: ludeeus/action-shellcheck@2.0.0
      with:
        severity: warning

    - name: Run hadolint (Dockerfile linting)
      id: hadolint
      if: inputs.skip-hadolint == 'false'
      uses: hadolint/hadolint-action@v3.5.0
      with:
        dockerfile: ${{ inputs.dockerfile-path }}
        format: sarif
        output-file: hadolint-results.sarif
        no-fail: true

    - name: Check if hadolint results exist
      id: check-hadolint
      if: inputs.skip-hadolint == 'false'
      shell: bash
      run: |
        if [ -f hadolint-results.sarif ]; then
          echo "sarif-file=hadolint-results.sarif" >> $GITHUB_OUTPUT
        else
          echo "sarif-file=" >> $GITHUB_OUTPUT
        fi

    - name: Upload hadolint results to GitHub
      if: inputs.skip-hadolint == 'false' && steps.check-hadolint.outputs.sarif-file != ''
      uses: github/codeql-action/upload-sarif@v4
      continue-on-error: true
      with:
        sarif_file: hadolint-results.sarif
        wait-for-processing: true
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}

    - name: Upload hadolint SARIF output
      if: inputs.skip-hadolint == 'false' && steps.check-hadolint.outputs.sarif-file != ''
      uses: actions/upload-artifact@v7
      with:
        name: hadolint-sarif${{ inputs.artifact-suffix }}
        path: hadolint-results.sarif

    # Python Setup and Linting
    - name: Set up Python
      if: inputs.language == 'python'
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install ruff (Python)
      if: inputs.language == 'python'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        # renovate: datasource=pypi depName=ruff
        pip install --quiet --disable-pip-version-check ruff==0.16.5

    - name: Run ruff lint (Python)
      if: inputs.language == 'python'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ruff check

    - name: Run ruff format check (Python)
      if: inputs.language == 'python'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ruff format --check

    # Go Setup and Linting
    - name: Set up Go
      if: inputs.language == 'go'
      uses: actions/setup-go@v7
      with:
        go-version: ${{ inputs.go-version }}

    - name: Run golangci-lint (Go)
      if: inputs.language == 'go'
      uses: golangci/golangci-lint-action@v9
      with:
        # renovate: datasource=github-releases depName=golangci/golangci-lint
        version: v2.15.0
        working-directory: ${{ inputs.working-directory }}

    - name: Run go fmt check (Go)
      if: inputs.language == 'go'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "Code is not formatted. Run 'go fmt ./...'"
          gofmt -s -l .
          exit 1
        fi

    - name: Run go vet (Go)
      if: inputs.language == 'go'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: go vet ./...

    # Node.js Setup and Linting
    - name: Set up Node.js
      if: inputs.language == 'nodejs'
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    - name: Install dependencies (Node.js)
      if: inputs.language == 'nodejs'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci

    - name: Run ESLint (Node.js)
      if: inputs.language == 'nodejs'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        has_config() { for f in "$@"; do [ -f "$f" ] && return 0; done; return 1; }
        in_package_json() { node -e 'process.exit(require("./package.json")[process.argv[1]] ? 0 : 1)' "$1" 2>/dev/null; }
        if has_config eslint.config.{js,mjs,cjs,ts,mts,cts} .eslintrc .eslintrc.{js,cjs,json,yml,yaml} \
          || in_package_json eslintConfig; then
          npx eslint .
        else
          echo "No ESLint config found, skipping ESLint"
        fi

    - name: Run Prettier check (Node.js)
      if: inputs.language == 'nodejs'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        has_config() { for f in "$@"; do [ -f "$f" ] && return 0; done; return 1; }
        in_package_json() { node -e 'process.exit(require("./package.json")[process.argv[1]] ? 0 : 1)' "$1" 2>/dev/null; }
        if has_config .prettierrc .prettierrc.{json,json5,yml,yaml,toml,js,mjs,cjs,ts,mts,cts} prettier.config.{js,mjs,cjs,ts,mts,cts} \
          || in_package_json prettier; then
          npx prettier --check .
        else
          echo "No Prettier config found, skipping Prettier"
        fi

    # Terraform Setup and Linting
    - name: Set up Terraform
      if: inputs.language == 'terraform'
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ inputs.terraform-version }}

    - name: Run terraform fmt check (Terraform)
      if: inputs.language == 'terraform'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform fmt -check -recursive

    - name: Run terraform validate (Terraform)
      if: inputs.language == 'terraform'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # One init + validate per module directory. (`find -execdir … \;` ran them once per
      # file and always exited 0, so validation errors never failed the step.)
      run: |
        mapfile -t dirs < <(find . -name '*.tf' -type f -not -path '*/.terraform/*' -printf '%h\n' | sort -u)
        rc=0
        for dir in "${dirs[@]}"; do
          echo "::group::terraform validate $dir"
          if ! (cd "$dir" && terraform init -backend=false -input=false && terraform validate); then
            echo "::error::terraform validate failed in $dir"
            rc=1
          fi
          echo "::endgroup::"
        done
        exit "$rc"

    - name: Run tflint (Terraform)
      if: inputs.language == 'terraform'
      uses: terraform-linters/setup-tflint@v6
      with:
        # renovate: datasource=github-releases depName=terraform-linters/tflint
        tflint_version: v0.64.0

    - name: Run TFLint
      if: inputs.language == 'terraform'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: tflint --init && tflint --recursive

    # Ansible Setup and Linting
    - name: Set up Python (Ansible)
      if: inputs.language == 'ansible'
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install ansible-lint and yamllint (Ansible)
      if: inputs.language == 'ansible'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        # renovate: datasource=pypi depName=ansible-lint
        pip install --quiet --disable-pip-version-check ansible-lint==26.8.0
        # renovate: datasource=pypi depName=yamllint
        pip install --quiet --disable-pip-version-check yamllint==1.38.0

    - name: Run yamllint (Ansible)
      if: inputs.language == 'ansible'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: yamllint .

    - name: Run ansible-lint (Ansible)
      if: inputs.language == 'ansible'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ansible-lint

    # Kubernetes Setup and Linting
    - name: Compute kubeconform args (Kubernetes)
      id: kubeconform_args
      if: inputs.language == 'kubernetes'
      shell: bash
      env:
        IGNORE_PATTERN: ${{ inputs.kubeconform-ignore-filename-pattern }}
        WORKING_DIR: ${{ inputs.working-directory }}
      run: |
        args="-summary -strict -ignore-missing-schemas"
        if [ -n "$IGNORE_PATTERN" ]; then
          args="$args -ignore-filename-pattern $IGNORE_PATTERN"
        fi
        args="$args $WORKING_DIR"
        echo "value=$args" >> "$GITHUB_OUTPUT"

    - name: Run kubeconform (Kubernetes)
      if: inputs.language == 'kubernetes'
      uses: docker://ghcr.io/yannh/kubeconform:v0.8.0
      with:
        args: ${{ steps.kubeconform_args.outputs.value }}

    # Installed directly instead of via stackrox/kube-linter-action: that action untars the
    # release (kube-linter, README.md, LICENSE) into the workspace root, overwriting the
    # caller's own README.md/LICENSE and tripping markdownlint.
    - name: Install kube-linter (Kubernetes)
      if: inputs.language == 'kubernetes'
      shell: bash
      env:
        # renovate: datasource=github-releases depName=stackrox/kube-linter
        KUBE_LINTER_VERSION: v0.8.3
      run: |
        case "$RUNNER_ARCH" in
          ARM64) asset=kube-linter-linux_arm64.tar.gz ;;
          *) asset=kube-linter-linux.tar.gz ;;
        esac
        dir="$RUNNER_TEMP/kube-linter"
        mkdir -p "$dir"
        curl -sSfL "https://github.com/stackrox/kube-linter/releases/download/$KUBE_LINTER_VERSION/$asset" | tar -xz -C "$dir"
        echo "$dir" >> "$GITHUB_PATH"

    - name: Run kube-linter (Kubernetes)
      if: inputs.language == 'kubernetes'
      shell: bash
      env:
        WORKING_DIR: ${{ inputs.working-directory }}
      run: kube-linter lint "$WORKING_DIR"
