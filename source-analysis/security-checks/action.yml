name: Security Checks
description: Check source code for security vulnerabilities using Trivy

inputs:
  working-directory:
    description: Directory containing the project source (relative to the checkout root)
    required: false
    default: '.'
  github-token:
    description: GitHub token for uploading SARIF results
    required: false
    default: ''
  docker-image:
    description: Docker image reference for Trivy scan
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Run Trivy filesystem scanner
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: fs
        scan-ref: ${{ inputs.working-directory }}
        format: sarif
        output: trivy-fs-results.sarif
        severity: CRITICAL,HIGH

    - name: Upload Trivy fs scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v4
      continue-on-error: true
      with:
        sarif_file: trivy-fs-results.sarif
        category: trivy-fs
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}

    - name: Upload Trivy fs SARIF artifact
      uses: actions/upload-artifact@v7
      with:
        name: trivy-fs-sarif
        path: trivy-fs-results.sarif

    - name: Run Trivy image scanner
      if: inputs.docker-image != ''
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ inputs.docker-image }}
        format: sarif
        output: trivy-results.sarif
        severity: CRITICAL,HIGH

    - name: Upload Trivy image scan results to GitHub Security tab
      if: inputs.docker-image != ''
      uses: github/codeql-action/upload-sarif@v4
      continue-on-error: true
      with:
        sarif_file: trivy-results.sarif
        category: trivy-image
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}

    - name: Upload Trivy image SARIF artifact
      if: inputs.docker-image != ''
      uses: actions/upload-artifact@v7
      with:
        name: trivy-sarif
        path: trivy-results.sarif
